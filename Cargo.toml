[workspace]
resolver = "3"
members = [
    "crates/lgbm-core",
    "crates/lgbm-compute",
    "crates/lgbm-dataset",
    "crates/lgbm-model",
    "crates/lgbm-treelearner",
    "crates/lgbm-objective",
    "crates/lgbm-metric",
    "crates/lgbm-boosting",
    "crates/lgbm",
    "crates/lgbm-python",
    "crates/oracle-harness",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
thiserror = "2.0.18"
anyhow = "1.0.102"
cubecl = "0.10.0"
