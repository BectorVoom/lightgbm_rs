[workspace]
resolver = "3"
members = [
    "crates/lgbm-core",
    "crates/lgbm-compute",
    "crates/lgbm-dataset",
    "crates/lgbm-model",
    "crates/lgbm-treelearner",
    "crates/lgbm-objective",
    "crates/lgbm-metric",
    "crates/lgbm-boosting",
    "crates/lgbm",
    "crates/lgbm-python",
    "crates/oracle-harness",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
thiserror = "2.0.18"
anyhow = "1.0.102"
cubecl = "0.10.0"

# Release profile tuned for the compute-heavy training path. Parity-neutral:
# these flags change codegen, not floating-point semantics (no fast-math). Fat LTO
# + a single codegen unit let the optimizer inline across the boosting →
# tree-learner → compute crate boundaries that dominate train time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Profiling profile (spike 002): opt-3 like release for representative hot-loop
# codegen, but LTO OFF + debug symbols so callgrind/profilers can attribute cost to
# distinct per-phase functions instead of one fat-LTO-inlined mega-function. NOT a
# perf-measurement profile — used only to localize where train time goes.
[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
debug = true

