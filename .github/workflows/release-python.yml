# Release the `lightgbm-rs` Python package.
#
# Builds maturin RELEASE wheels (abi3-py311 → one wheel per platform covers Python
# 3.11+) for Linux / macOS / Windows plus an sdist, then publishes to PyPI on a `v*`
# tag via OIDC Trusted Publishing (no API token stored).
#
# Triggers:
#   • push a tag like `v0.1.0`  → build + publish to PyPI
#   • workflow_dispatch (manual) → build only, wheels uploaded as run artifacts
#     (lets you validate the build before tagging a real release)
#
# One-time PyPI setup required before the first tagged release (see
# .planning/quick/260627-rh0-*/SUMMARY.md for the click-path):
#   1. On https://pypi.org create/claim the project `lightgbm-rs` (a "pending"
#      trusted publisher works before the first upload).
#   2. Add a Trusted Publisher:
#        Owner: BectorVoom   Repo: lightgbm_rs
#        Workflow: release-python.yml   Environment: pypi
#   3. (Recommended) Create a GitHub Environment named `pypi` on the repo.
#
# Both a default CPU-only wheel and an AMD ROCm GPU wheel (--features rocm) are built.
# They publish to TWO SEPARATE PyPI projects (`lightgbm-rs` and `lightgbm-rs-rocm`),
# not one — PyPI rejects any upload whose version carries a PEP 440 local segment
# (tried `0.0.8+rocm`, got a hard `400 The use of local versions ... is not allowed`),
# and maturin's wheel filename doesn't otherwise encode Cargo features, so the CPU and
# ROCm wheels for the same version+platform would collide under one project name. Both
# variants install the same importable `lightgbm_rs` package, so treat them as mutually
# exclusive in one environment (same pattern as e.g. `tensorflow` vs `tensorflow-gpu`).
#
# One-time PyPI setup for the ROCm project (do this before the first ROCm release; the
# `release-rocm` job below will keep failing with an OIDC/publish error until it's done):
#   1. On https://pypi.org create/claim the project `lightgbm-rs-rocm`.
#   2. Add a Trusted Publisher:
#        Owner: BectorVoom   Repo: lightgbm_rs
#        Workflow: release-python.yml   Environment: pypi-rocm
#   3. (Recommended) Create a GitHub Environment named `pypi-rocm` on the repo.
name: Release Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # maturin builds this workspace member; its pyproject.toml sits next to the Cargo.toml.
  MANIFEST: --manifest-path crates/lgbm-python/Cargo.toml

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheels (manylinux_2_34, x86_64)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          # 2_34 (AlmaLinux 9, glibc 2.34 + GCC 11 libstdc++) — the prebuilt `llvm-config`
          # the cubecl-cpu `tracel-llvm-bundler` fetches needs GLIBC_2.34 + GLIBCXX_3.4.29,
          # so the older 2_28 (glibc 2.28) container fails to run it. PyPI accepts the
          # resulting manylinux_2_34 tag.
          manylinux: "2_34"
          # rust-toolchain.toml pins 1.95.0 (edition 2024); pass it explicitly so the
          # container's rustup selects it.
          rust-toolchain: "1.95.0"
          args: --release --out dist ${{ env.MANIFEST }}
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist

  linux-rocm:
    name: Build ROCm wheel (linux, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Rename ROCm build's PyPI project so it doesn't collide with the CPU wheel
        # maturin's wheel filename encodes package name/version/Python-ABI/platform
        # but not Cargo features, so this job and the `linux` job would otherwise
        # both produce a wheel named identically
        # (lightgbm_rs-X.Y.Z-cp311-abi3-manylinux_2_34_x86_64.whl). A PEP 440 local
        # version segment (`+rocm`) was tried and rejected outright by PyPI's upload
        # API ("use of local versions ... is not allowed"), so instead this patches
        # pyproject.toml's static `[project] name` for this job only, publishing the
        # ROCm wheel to a separate `lightgbm-rs-rocm` PyPI project (see header comment).
        run: sed -i 's/^name = "lightgbm-rs"/name = "lightgbm-rs-rocm"/' crates/lgbm-python/pyproject.toml
      - name: Build ROCm wheels (manylinux_2_34, x86_64)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: "2_34"
          rust-toolchain: "1.95.0"
          before-script-linux: "pip install patchelf"
          args: --release --features rocm --out dist ${{ env.MANIFEST }}
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-rocm-x86_64
          path: dist

  macos:
    # Apple Silicon (arm64) only. GitHub is retiring the Intel `macos-13` runner, so an
    # x86_64 job hangs indefinitely waiting for an unavailable runner. Intel-Mac users
    # install from the sdist (build-from-source). Cross-compiling x86_64 on this arm64
    # runner was rejected: the tracel-llvm-bundler cross path is unverified/risky.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheels (macOS aarch64)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          rust-toolchain: "1.95.0"
          args: --release --out dist ${{ env.MANIFEST }}
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-aarch64
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
      - name: Build wheels (Windows x64)
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          rust-toolchain: "1.95.0"
          args: --release --out dist ${{ env.MANIFEST }}
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist ${{ env.MANIFEST }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # Publish to PyPI via OIDC Trusted Publishing — ONLY on a `v*` tag (manual
  # workflow_dispatch runs stop after building the artifacts above). Deliberately
  # independent of `release-rocm`: a failure/missing-setup on the ROCm project must
  # never block the main `lightgbm-rs` package from publishing (see header comment
  # for why the ROCm wheel can't just be folded into this same upload).
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Collect CPU wheels + sdist
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-!(linux-rocm-*)
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release-rocm:
    name: Publish ROCm wheel to PyPI (lightgbm-rs-rocm)
    runs-on: ubuntu-latest
    needs: [linux-rocm]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: pypi-rocm
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Collect ROCm wheel
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-linux-rocm-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
