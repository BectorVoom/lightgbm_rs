[package]
name = "lgbm-compute"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
cubecl = { workspace = true, features = ["cpu"] }
lgbm-core = { path = "../lgbm-core" }
lgbm-dataset = { path = "../lgbm-dataset" }
# lgbm-model path dep so the on-device tree-growth seam (`grow_tree_on_device`)
# can name `lgbm_model::Tree` as its return type. VERIFIED acyclic: lgbm-model
# depends only on lgbm-core + lgbm-dataset + thiserror (NOT on lgbm-compute), so
# the lgbm-compute → lgbm-model edge introduces no crate cycle (D-03 Option A).
lgbm-model = { path = "../lgbm-model" }
thiserror = { workspace = true }
rayon = "1.10"
# rocm-only, optional: direct FFI to query the device's actual Compute Unit count
# (`hipGetDevicePropertiesR0600().multiProcessorCount`) so the row-partition
# occupancy target derives from real hardware instead of a hardcoded phantom-96-CU
# value. Already a transitive dep of cubecl-hip (lockfile 7.1.x); promoting it to a
# DIRECT optional dep gated on `rocm` keeps the default cpu build from compiling or
# linking it (SC#1). Its own build.rs auto-selects the right ROCm bindings.
cubecl-hip-sys = { version = "7", optional = true }
# rocm-only, optional: serde now SHIPS (rocm-gated), no longer dev-only. The cubecl
# `AutotuneKey` trait alias (used by `kernels::autotune::LaunchKey`) requires
# `serde::{Serialize, DeserializeOwned}` whenever the persistent disk cache is active
# (`std_io` cfg = std + linux/macos/windows, always on here), so serde is mandatory in
# the crate that DEFINES the key (spike-037 carry-forward). `optional = true` + the
# `rocm` feature gate keeps the default cpu build from compiling or linking serde-derive
# on the hot path. serde 1.x is the canonical, pre-vetted crate already in the lockfile.
serde = { version = "1", features = ["derive"], optional = true }

# macOS-only: `sysctlbyname("hw.perflevel0.physicalcpu")` so the spin crew's
# default size is the PERFORMANCE-core count on Apple Silicon — spinning workers
# scheduled onto E-cores measurably regress the crew (255-leaf bench: 8 threads
# 4267ms vs 4 threads 3903ms on an M1 4P+4E), and the C++ reference shows the
# same shape (LightGBM 4.6 best nthread = 4 on this box). libc is already a
# transitive dep (cubecl lockfile), so this adds no new supply-chain surface.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
# `cpu` (default) keeps the cubecl-cpu reference runtime always available — it is
# the D-04 deterministic anchor, not an optional path. `rocm` is opt-in so a
# CPU-only build needs no ROCm toolchain present (SC#1, CMP-03 prep).
default = ["cpu"]
cpu = []
# `gpu` is the umbrella feature every GPU backend turns on. It widens the resident
# histogram pool + LDS/scan kernels + the `cubecl::tune` autotune module (quick-260627-qxl)
# from rocm-only to "any GPU backend", so cuda/wgpu reuse the SAME generic `GpuBackend<R>`
# code without forking it. `dep:serde` moves here (from `rocm`) because the autotune
# persistent disk cache derives Serialize/Deserialize on `LaunchKey` and is now shared by
# every GPU backend. The rocm-only `cubecl_hip_sys` CU-count FFI stays gated on `rocm`.
gpu = ["dep:serde"]
rocm = ["cubecl/hip", "dep:cubecl-hip-sys", "gpu"]
# CUDA backend (cubecl-cuda / `cubecl::cuda::CudaRuntime`). `cuda`/`wgpu` are
# sub-features of the already-vetted `cubecl 0.10.0` workspace dep — NO new
# `[dependencies]` entry is added (no package-legitimacy gate applies).
cuda = ["cubecl/cuda", "gpu"]
# WGPU backend (cubecl-wgpu / `cubecl::wgpu::WgpuRuntime`). NOTE (locked decision
# #3): the f32-atomic LDS histogram kernel may not compile for the WGSL target
# (WGSL has no f32 atomics); a `--features wgpu` check failure there is an accepted
# discovered outcome, recorded — not worked around.
wgpu = ["cubecl/wgpu", "gpu"]

[dev-dependencies]
oracle-harness = { path = "../oracle-harness" }
